<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Afbeelding</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    img {
      max-height: 75%;
      max-width: 90%;
      object-fit: contain;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      border-radius: 8px;
    }

    .back-button {
      margin-top: 30px;
      padding: 20px 40px;
      background-color: red;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-size: 1.5rem;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: background 0.3s ease;
    }

    .back-button:hover {
      background-color: darkred;
    }
  </style>
</head>
<body>

  <img src="images/404 development(2).png" alt="Afbeelding">
  <a class="back-button" href="projecten.html">← Terug naar vorige pagina</a>

</body>
</html>
