<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catch the Falling Stars</title>
  <style>
    body {
      margin: 0;
      background: radial-gradient(circle, #001f3f 0%, #000000 100%);
      color: white;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    canvas {
      border: 5px solid #fff;
      border-radius: 20px;
      background: #000814;
      box-shadow: 0 0 30px rgba(255,255,255,0.2);
    }
    #scoreboard, #menuButton {
      position: absolute;
      background: rgba(0,0,0,0.6);
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 16px;
      z-index: 10;
    }
    #scoreboard {
      top: 10px;
      left: 10px;
    }
    #menuButton {
      top: 10px;
      right: 10px;
      cursor: pointer;
    }
    #menuOverlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #001f3f, #000000);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 20;
      color: white;
      text-align: center;
    }
    #menuOverlay h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }
    #menuOverlay p {
      font-size: 18px;
      margin-bottom: 30px;
      color: #ccc;
    }
    #menuOverlay button {
      padding: 12px 30px;
      font-size: 20px;
      border: none;
      border-radius: 8px;
      background: #FFD700;
      color: #000;
      cursor: pointer;
      margin: 5px;
      transition: background 0.3s;
    }
    #menuOverlay button:hover {
      background: #ffc400;
    }
  </style>
</head>
<body>
  <div id="scoreboard">Score: 0 | Missed: 0</div>
  <div id="menuButton" onclick="showMainMenu()">🏠 Menu</div>
  <div id="menuOverlay">
    <h1>⭐ Catch the Falling Stars ⭐</h1>
    <p>Move with ⬅️ ➡️ — Catch 5 ⭐ or more!</p>
    <button onclick="startGame()">Start Game</button>
  </div>
  <canvas id="gameCanvas" width="600" height="400"></canvas>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreboard = document.getElementById("scoreboard");
    const menuOverlay = document.getElementById("menuOverlay");
    const menuButton = document.getElementById("menuButton");

    const player = {
      x: 275,
      y: 360,
      width: 80,
      height: 20,
      speed: 6
    };

    let keys = {}, stars = [], score = 0, missed = 0, gameOver = false;
    let spawnRate = 900, starTimer;

    function startGame() {
      stars = [];
      score = 0;
      missed = 0;
      gameOver = false;
      player.x = 275;
      scoreboard.style.display = "block";
      menuOverlay.style.display = "none";
      if (starTimer) clearInterval(starTimer);
      starTimer = setInterval(() => { if (!gameOver) spawnStar(); }, spawnRate);
      requestAnimationFrame(gameLoop);
    }

    function spawnStar() {
      stars.push({
        x: Math.random() * (canvas.width - 30),
        y: -30,
        radius: 15,
        speed: 1.5 + Math.random(),
        angle: 0,
        spin: Math.random() * 0.1
      });
    }

    function update() {
      if (keys["ArrowLeft"]) player.x -= player.speed;
      if (keys["ArrowRight"]) player.x += player.speed;
      player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));

      for (let i = stars.length - 1; i >= 0; i--) {
        const s = stars[i];
        s.y += s.speed;
        s.angle += s.spin;

        if (s.y + s.radius > player.y && s.x > player.x && s.x < player.x + player.width) {
          score++;
          stars.splice(i, 1);
        } else if (s.y > canvas.height) {
          missed++;
          stars.splice(i, 1);
          if (missed >= 5) {
            gameOver = true;
            setTimeout(() => showEndMenu("Game Over!"), 500);
          }
        }
      }

      scoreboard.textContent = `Score: ${score} | Missed: ${missed}`;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#FFD700";
      ctx.fillRect(player.x, player.y, player.width, player.height);

      for (const s of stars) {
        ctx.save();
        ctx.translate(s.x + s.radius, s.y + s.radius);
        ctx.rotate(s.angle);
        ctx.font = `${s.radius * 1.8}px serif`;
        ctx.fillText("⭐", -s.radius, s.radius / 2);
        ctx.restore();
      }
    }

    function gameLoop() {
      if (!gameOver) {
        update();
        draw();
        requestAnimationFrame(gameLoop);
      }
    }

    function showEndMenu(title) {
      menuOverlay.innerHTML = `<h1>${title}</h1><p>Your score: ${score} ⭐</p><button onclick='startGame()'>Play Again</button><button onclick='showMainMenu()'>Back to Menu</button>`;
      menuOverlay.style.display = "flex";
    }

    function showMainMenu() {
      if (starTimer) clearInterval(starTimer);
      menuOverlay.innerHTML = `<h1>⭐ Catch the Falling Stars ⭐</h1><p>Move with ⬅️ ➡️ — Catch 5 ⭐ or more!</p><button onclick='startGame()'>Start Game</button>`;
      menuOverlay.style.display = "flex";
      scoreboard.style.display = "none";
      gameOver = true;
    }

    window.addEventListener("keydown", e => keys[e.key] = true);
    window.addEventListener("keyup", e => keys[e.key] = false);
  </script>
</body>
</html>
